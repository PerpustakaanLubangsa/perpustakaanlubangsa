<!doctype html>
<html lang="id">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#2563eb" />
    <title>Tidak ada koneksi</title>
    <style>
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
        background: #eff6ff;
        color: #1e293b;
        font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
      }
      .card {
        max-width: 380px;
        width: 100%;
        background: #fff;
        border: 1px solid #dbeafe;
        border-radius: 16px;
        padding: 28px 24px;
        text-align: center;
        box-shadow: 0 4px 12px rgba(37, 99, 235, 0.08);
      }
      .icon {
        width: 48px;
        height: 48px;
        margin: 0 auto 14px;
        border-radius: 50%;
        background: #dbeafe;
        color: #2563eb;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 24px;
        font-weight: 800;
      }
      h1 { margin: 0 0 8px; font-size: 18px; color: #1d4ed8; }
      p { margin: 0 0 20px; font-size: 13px; line-height: 1.6; color: #475569; }
      button {
        width: 100%;
        border: 0;
        border-radius: 12px;
        padding: 10px 16px;
        background: #2563eb;
        color: #fff;
        font-size: 13px;
        font-weight: 700;
        cursor: pointer;
      }
      button:hover { background: #1d4ed8; }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="icon">!</div>
      <h1>Tidak ada koneksi internet</h1>
      <p>
        Aplikasi sirkulasi membutuhkan koneksi untuk membaca dan mencatat data peminjaman.
        Periksa jaringan Anda, lalu coba lagi.
      </p>
      <button onclick="location.reload()">Coba Lagi</button>
    </div>
  </body>
</html>
